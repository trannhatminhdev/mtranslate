services:
  api:
    build:
      context: ../../apps/be
      dockerfile: ../../docker/be/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../../apps/be/.env
    volumes:
      - ../../apps/be/src:/app/src
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
